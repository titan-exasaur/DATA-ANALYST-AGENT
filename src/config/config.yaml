app:
  name: "AI Data Analyst Agent"
  environment: "development"
  debug: true

upload:
  MAX_UPLOAD_SIZE_MB: 10
  ALLOWED_EXTENSIONS:
    - ".csv"
    - ".xlsx"
    - ".xls"

llm:
  provider: "openai"
  model: "gpt-4o"
  temperature: 0

schema_agent:
  high_null_threshold_pct: 20
  sample_values_count: 3