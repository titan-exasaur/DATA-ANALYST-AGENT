<?xml version="1.0" encoding="utf-8"?>
<svg width="100%" viewBox="0 0 680 720" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LangGraph GenAI Architecture Diagram</title>
  <desc>Architecture showing a user browser connecting to a FastAPI frontend, which feeds into a LangGraph multi-agent pipeline, backed by OpenAI GPT-4o, MongoDB Atlas, and Azure Blob Storage, all deployed on Azure Container Apps via Azure Container Registry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .node { cursor: pointer; }
      .node:hover rect { opacity: 0.85; }

      /* c-gray */
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th { fill: #444441; }
      .c-gray .ts { fill: #5F5E5A; }

      /* c-blue */
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th { fill: #0C447C; }
      .c-blue .ts { fill: #185FA5; }

      /* c-purple */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th { fill: #3C3489; }
      .c-purple .ts { fill: #534AB7; }

      /* c-coral */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th { fill: #712B13; }
      .c-coral .ts { fill: #993C1D; }

      /* c-teal */
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th { fill: #085041; }
      .c-teal .ts { fill: #0F6E56; }
    </style>
  </defs>
  <rect x="22" y="256" width="636" height="404.792" rx="16" fill="none" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.5" ry="16" style=""/>
  <text x="38" y="276" font-family="Arial, sans-serif" font-size="12" fill="#185FA5" opacity="0.75" font-weight="500" style="white-space: pre;">Azure</text>
  <rect x="40" y="290" width="390" height="306" rx="12" fill="none" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.5"/>
  <text x="183.257" y="310.99" font-family="Arial, sans-serif" font-size="12" fill="#534AB7" opacity="0.7" font-weight="500" style="white-space: pre; font-size: 12px;">LangGraph pipeline</text>
  <rect x="448" y="290" width="194" height="306" rx="12" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="5 3" opacity="0.5"/>
  <text x="464" y="308" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56" opacity="0.7" font-weight="500" style="white-space: pre;">External services</text>
  <g class="node c-gray">
    <rect x="268" y="24" width="144" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="46" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">User browser</text>
  </g>
  <g class="node c-blue">
    <rect x="210" y="108" width="170" height="56" stroke-width="0.5" rx="8"/>
    <text class="th" x="295" y="128" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">FastAPI + Jinja2</text>
    <text class="ts" x="295" y="149" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Frontend UI</text>
  </g>
  <g class="node c-blue">
    <g>
      <rect x="424" y="108" width="160" height="56" stroke-width="0.5" rx="8"/>
    </g>
    <g>
      <text class="th" x="500" y="128" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">JavaScript + Plotly</text>
    </g>
    <g>
      <text class="ts" x="500" y="149" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Chart rendering</text>
    </g>
  </g>
  <g class="node c-purple">
    <rect x="55" y="322" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="109" y="341" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Schema agent</text>
    <text class="ts" x="109" y="358" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Detect structure</text>
  </g>
  <g class="node c-purple">
    <rect x="181" y="322" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="341" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Cleaning agent</text>
    <text class="ts" x="235" y="358" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Normalize data</text>
  </g>
  <g class="node c-purple">
    <rect x="307" y="322" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="361" y="341" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Query planner</text>
    <text class="ts" x="361" y="358" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Plan queries</text>
  </g>
  <g class="node c-coral">
    <rect x="55" y="418" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="109" y="437" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Analysis agent</text>
    <text class="ts" x="109" y="454" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Run analytics</text>
  </g>
  <g class="node c-coral">
    <rect x="181" y="418" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="437" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Viz agent</text>
    <text class="ts" x="235" y="454" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Build charts</text>
  </g>
  <g class="node c-coral">
    <rect x="307" y="418" width="108" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="361" y="437" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Report agent</text>
    <text class="ts" x="361" y="454" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Generate report</text>
  </g>
  <g class="node c-teal">
    <rect x="463" y="322" width="162" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="544" y="341" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">OpenAI GPT-4o</text>
    <text class="ts" x="544" y="358" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">LLM backbone</text>
  </g>
  <g class="node c-teal">
    <rect x="463" y="393" width="162" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="544" y="412" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">MongoDB Atlas</text>
    <text class="ts" x="544" y="429" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Document store</text>
  </g>
  <g class="node c-teal">
    <rect x="463" y="464" width="162" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="544" y="483" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Azure Blob Storage</text>
    <text class="ts" x="544" y="500" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">File store</text>
  </g>
  <g class="node c-blue" transform="matrix(1, 0, 0, 1, -0.354557, 56.23563)">
    <rect x="80" y="546" width="154" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="157" y="565" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Container Registry</text>
    <text class="ts" x="157" y="582" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Image store (ACR)</text>
  </g>
  <g class="node c-blue" transform="matrix(1, 0, 0, 1, 2.501065, 55.818043)">
    <rect x="266" y="546" width="154" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="343" y="565" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Container Apps</text>
    <text class="ts" x="343" y="582" text-anchor="middle" dominant-baseline="central" style="white-space: pre;">Runtime (ACA)</text>
  </g>
